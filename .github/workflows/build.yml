name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    name: Rhino 8 Mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.422
          cache: true
          cache-dependency-path: ObjectManager/ObjectManager.csproj
      - run: dotnet restore ObjectManager/ObjectManager.csproj
      - run: dotnet build ObjectManager/ObjectManager.csproj -f net7.0 --no-restore

  windows:
    name: Rhino 8 Windows compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.422
          cache: true
          cache-dependency-path: ObjectManager/ObjectManager.csproj
      - run: dotnet restore ObjectManager/ObjectManager.csproj
      - run: dotnet build ObjectManager/ObjectManager.csproj -f net48 --no-restore
